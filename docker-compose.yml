services:
  # Our PostgreSQL database
  blogdb:
    # Using the latest PostgreSQL image
    image: postgres:latest
    ports:
      - "54321:5432"
    restart: always
    environment:
      POSTGRES_PASSWORD: ThisIsNotARealPassword

  # Database management interface
  blogadminer:
    image: adminer:latest
    restart: always
    ports:
      - 8888:8080